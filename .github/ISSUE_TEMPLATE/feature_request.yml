name: Feature request
description: An idea for a new key, view or setting.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. A sketch of a deck.vrx key is welcome.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Other ways you've tried, or links to similar tools.
